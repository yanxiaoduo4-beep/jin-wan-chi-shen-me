dth:100%;border:1px solid #ded4c8;border-radius:12px;padding:12px;background:#fffdf9;font:inherit;color:var(--ink)}label{font-size:13px;color:var(--muted);display:block;margin:12px 0 6px}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:720px;margin:auto 0 0;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.close{float:right;border:0;background:none;font-size:24px;color:#999}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#3f3a34;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:30;font-size:14px}

<body><div class="app">
<header><div class="ey">今晚 · 一顿好好吃的饭</div><div class="title">今晚吃什么</div><div class="sub" id="date"></div></header>
<main>
<section id="today" class="view active">
<div class="card hero"><h2>今天也好好吃饭。</h2><p class="sub">不用想太久。告诉我今天的感觉，我帮你把这一顿搭起来。</p><div class="actions"><button class="btn primary" onclick="recommend()">帮我决定</button><button class="btn" onclick="go('choose')">自己选菜</button></div></div>
<div class="section">今天的感觉</div><div class="chips" id="moods"></div>
<div class="card"><div class="row"><b>今日小建议</b><span class="tag">温柔提醒</span></div><p class="sub" id="advice"></p></div>
<div class="section">最近饭桌</div><div id="recent"></div>
</section>
<section id="choose" class="view"><div class="card"><div class="row"><div><b>今晚一起选</b><div class="sub">两个人可以各自选，最后合成一桌</div></div><span class="tag" id="count">0 道</span></div></div><div id="groups"></div><button class="btn primary" style="width:100%" onclick="makeMenu()">生成今晚菜单</button></section>
<section id="menu" class="view"><div class="card hero"><h2>今晚，就吃这些。</h2><p class="sub" id="summary"></p><div id="menuList"></div><div class="note" id="menuAdvice"></div></div><div class="actions"><button class="btn primary" onclick="go('shopping')">去买菜</button><button class="btn" onclick="openRecord()">吃完记录一下</button></div></section>
<section id="shopping" class="view"><div class="card"><div class="row"><b>今晚买什么</b><span class="tag">自动整理</span></div><div id="shop"></div></div><div class="note">以后接入家庭库存后，我还会自动扣掉“家里已经有”的东西。</div></section>
<section id="record" class="view"><div class="card hero"><h2>把这一顿留下来。</h2><p class="sub">不是打卡，只是以后回头看，会记得那天吃了什么。</p><label>今天的菜单</label><input id="rmenu"><label>想说一句</label><textarea id="rtext" rows="4" placeholder="今天也好好吃饭。"></textarea><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveRecord()">保存到饭桌</button></div><div id="records"></div></section>
<section id="family" class="view"><div class="card"><div class="row"><div><b>我的家</b><div class="sub">把你们家的口味慢慢告诉我</div></div><span class="tag" id="syncTag">云端</span></div></div><div class="card"><b>我</b><label>喜欢</label><input id="meLikes" placeholder="清淡、鱼、蔬菜、汤…"><label>不吃 / 不喜欢</label><input id="meDislikes" placeholder="香菜、太辣…"></div><div class="card"><b>老公</b><label>喜欢</label><input id="himLikes" placeholder="牛肉、鸡翅、鱼…"><label>不吃 / 不喜欢</label><input id="himDislikes" placeholder="香菜…"><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveFamily()">保存口味</button></div><div class="card"><b>邀请老公加入</b><p class="sub">创建家庭后，把邀请链接发给他。他在自己的手机打开即可加入。</p><button class="btn" onclick="createInvite()">生成邀请链接</button><input id="invite" style="margin-top:10px;display:none" readonly></div></section>
</main>
<nav class="bottom"><button class="nav on" onclick="go('today')"><b>⌂</b>今天</button><button class="nav" onclick="go('choose')"><b>♡</b>一起选</button><button class="nav" onclick="go('menu')"><b>🍚</b>菜单</button><button class="nav" onclick="go('shopping')"><b>🛒</b>买菜</button><button class="nav" onclick="go('record')"><b>☕</b>饭桌</button></nav>
</div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>

['egg','蛋豆','番茄炒蛋','番茄、鸡蛋、葱',['家常','快手']],['shrimpEgg','蛋豆','虾仁蒸蛋','虾仁、鸡蛋、葱',['清淡']],['tofu','蛋豆','麻婆豆腐','豆腐、肉末、豆瓣酱',['下饭']],['scallionEgg','蛋豆','葱花炒蛋','鸡蛋、小葱',['快手','清淡']],['tofuScallion','蛋豆','家常豆腐','豆腐、青椒、木耳',['下饭']],['eggplantEgg','蛋豆','茄子炒蛋','茄子、鸡蛋、蒜',['下饭']],['tofuShrimp','蛋豆','虾仁豆腐','虾仁、嫩豆腐、葱',['清淡']],['edamameEgg','蛋豆','毛豆炒鸡蛋','毛豆、鸡蛋、胡萝卜',['快手']],['tofuMince','蛋豆','肉末蒸豆腐','豆腐、猪肉末、葱',['暖胃']],['eggTofu','蛋豆','鸡蛋豆腐煲','鸡蛋、豆腐、香菇',['暖胃']],

let S=JSON.parse(localStorage.getItem('jw5')||'{}');S.selected=S.selected||[];S.records=S.records||[];S.family=S.family||{};S.mood=S.mood||'';
const moods=['清淡','下饭','解馋','快手','暖胃','想吃点好的'];
function save(){localStorage.setItem('jw5',JSON.stringify(S))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));let i=['today','choose','menu','shopping','record'].indexOf(id);if(i>=0)document.querySelectorAll('.nav')[i].classList.add('on');render()}
function picked(){return S.selected.map(id=>dishes.find(d=>d.id===id)).filter(Boolean)}
function render(){
document.getElementById('date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
document.getElementById('moods').innerHTML=moods.map(m=>`<button class="chip ${S.mood===m?'on':''}" onclick="setMood('${m}')">${m}</button>`).join('');
renderGroups();renderMenu();renderShop();renderRecords();renderHome();loadFamily();
}
function setMood(m){S.mood=m;save();recommend(m)}
function renderGroups(){let cats=[...new Set(dishes.map(d=>d.cat))];document.getElementById('groups').innerHTML=cats.map(c=>`<div class="card"><div class="section">${c}</div>${dishes.filter(d=>d.cat===c).map(d=>`<div class="dish"><div><h4>${d.name}</h4><small>${d.tags.join(' · ')||'家常'}　${d.ing}</small></div><button class="check ${S.selected.includes(d.id)?'on':''}" onclick="toggle('${d.id}')">${S.selected.includes(d.id)?'✓':''}</button></div>`).join('')}</div>`).join('');document.getElementById('count').textContent=S.selected.length+' 道'}
function toggle(id){S.selected=S.selected.includes(id)?S.selected.filter(x=>x!==id):[...S.selected,id];save();renderGroups()}
function recommend(m=S.mood){let map={'清淡':['fish','lettuce','shrimpEgg','mushroomSoup','rice'],'下饭':['beef','cabbage','egg','tomatoBeefSoup','rice'],'解馋':['wings','ribs','cucumber','tomatoSoup','rice'],'快手':['beefOnion','broccoli','egg','seaweedSoup','rice'],'暖胃':['chicken','cabbage','tofuMince','yamSoup','rice'],'想吃点好的':['salmon','garlicShrimp','broccoli','mushroomSoup','rice']};S.selected=map[m||'']||map['暖胃'];save();go('menu');toast('好啦，今晚就这样吃')}
function makeMenu(){if(!S.selected.length)return toast('先选几道菜吧');go('menu')}
function renderMenu(){let ds=picked();document.getElementById('summary').textContent=ds.length?`一共 ${ds.length} 道，尽量让这一桌吃起来舒服。`:'还没有今晚的菜单。';document.getElementById('menuList').innerHTML=ds.length?ds.map(d=>`<div class="dish"><div><h4>${d.name}</h4><small>${d.cat} · ${d.ing}</small></div></div>`).join(''):'<div class="empty">去「一起选」挑几道吧。</div>';let heavy=ds.some(d=>['wings','ribs'].includes(d.id)),veg=ds.some(d=>d.cat==='素菜');document.getElementById('menuAdvice').textContent=heavy&&!veg?'今晚有偏浓郁的菜，可以顺手加一份清爽蔬菜。':veg?'蔬菜已经安排上了，今天这桌会比较舒服。':'搭配不错，今晚好好吃饭就好。'}
function renderShop(){let map={};picked().forEach(d=>d.ing.split('、').forEach(x=>map[x]=(map[x]||0)+1));document.getElementById('shop').innerHTML=Object.keys(map).length?Object.keys(map).map(x=>`<div class="dish"><span>${x}</span><button class="check" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'✓':''"></button></div>`).join(''):'<div class="empty">选好菜单后，这里会自动列出要买的东西。</div>'}
function openRecord(){document.getElementById('rmenu').value=picked().map(x=>x.name).join('、');go('record')}
async function saveRecord(){let menu=document.getElementById('rmenu').value.trim(),text=document.getElementById('rtext').value.trim();if(!menu)return toast('先写下今天吃了什么');let r={date:new Date().toLocaleDateString('zh-CN'),menu,text};S.records.unshift(r);S.records=S.records.slice(0,50);save();if(sb&&S.user){await sb.from('meal_records').insert({household_id:S.householdId,author_id:S.user.id,menu_text:menu,note:text})}document.getElementById('rtext').value='';toast('这一顿已经留下来了');renderRecords()}
function renderRecords(){document.getElementById('records').innerHTML=S.records.length?S.records.map(r=>`<div class="card"><div class="row"><b>${r.date}</b><span class="tag">饭桌</span></div><p><b>${r.menu}</b></p><p class="sub">${r.text||'今天也好好吃饭。'}</p></div>`).join(''):'<div class="empty">还没有饭桌记录。今晚吃完，留一句话给未来的自己。</div>'}
function renderHome(){document.getElementById('advice').textContent=picked().length?document.getElementById('menuAdvice').textContent:'如果不知道吃什么，就点一个心情。我会给一个不费脑子的答案。';document.getElementById('recent').innerHTML=S.records.slice(0,2).map(r=>`<div class="card"><b>${r.menu}</b><div class="sub">${r.text||''}</div></div>`).join('')||'<div class="empty">你的第一顿饭，还等着今晚。</div>'}
function loadFamily(){let f=S.family||{};['meLikes','meDislikes','himLikes','himDislikes'].forEach(k=>{let e=document.getElementById(k);if(e)e.value=f[k]||''});document.getElementById('syncTag').textContent=remoteReady?'云端':'本机'}
async function saveFamily(){S.family={meLikes:meLikes.value,meDislikes:meDislikes.value,himLikes:himLikes.value,himDislikes:himDislikes.value};save();if(sb&&S.user){await sb.from('household_members').upsert({household_id:S.householdId,user_id:S.user.id,role:'owner',preferences:S.family},{onConflict:'household_id,user_id'})}toast('你们家的口味记住啦')}
function createInvite(){let code=crypto.randomUUID().slice(0,8);let u=location.href.split('#')[0]+'#join='+code;let e=document.getElementById('invite');e.value=u;e.style.display='block';e.select();navigator.clipboard?.writeText(u);toast('邀请链接已复制')}
async function initCloud(){if(!sb)return;let {data:{session}}=await sb.auth.getSession();if(session){S.user=session.user;save()}}
initCloud();render();
</script></body></html>
